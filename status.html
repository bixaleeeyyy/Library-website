<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap page">
  <h1>Reading status</h1>
  <p class="muted" id="who"></p>
  <div class="stats" id="stats"></div>

  <div class="two">
    <section class="card"><h2 style="font-size:18px">This week</h2><div class="week" id="week"></div><p class="muted" id="streaknote" style="font-size:13px;margin-bottom:0"></p></section>
    <section class="card"><h2 style="font-size:18px">Yearly goal</h2>
      <div style="display:flex;align-items:center;gap:16px;margin-top:12px">
        <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="none" stroke="#E4E9E5" stroke-width="10"/><circle id="ring" cx="48" cy="48" r="40" fill="none" stroke="#1E6B5C" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 251.3" transform="rotate(-90 48 48)"/></svg>
        <div><b id="goaltext" style="font-size:18px"></b><div class="muted" id="goalsub" style="font-size:13px"></div></div>
      </div>
      <label for="goal">Books I want to read this year</label>
      <input id="goal" type="number" min="1" max="500">
    </section>
  </div>

  <section class="card" style="margin-top:12px"><h2 style="font-size:18px">Currently reading</h2><div id="reading"></div></section>
  <section class="card" style="margin-top:12px"><h2 style="font-size:18px">Borrowed books</h2><div id="borrowed"></div></section>
  <section class="card" style="margin-top:12px"><h2 style="font-size:18px">Badges</h2><div class="tabs" id="badges"></div></section>
</main>
<div id="site-footer"></div>
<script src="js/lib.js"></script>
<script>
(function () {
  var E = Lib.esc, u = Lib.user();
  document.getElementById('who').textContent = u ? 'Showing reading activity for ' + (u.name || u.email) + '.' : 'You are not signed in. Activity is saved for this browser only. Sign in to keep it with your account.';

  var pr = Lib.progress(), ids = Object.keys(pr).filter(function (id) { return Lib.book(id); });
  var finished = ids.filter(function (id) { return pr[id].page >= pr[id].total; }).length;
  var pages = ids.reduce(function (n, id) { return n + pr[id].page; }, 0);
  var hours = Math.round(Lib.minutes() / 6) / 10, streak = Lib.streak();
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>' + hours + '</b><span>Hours read</span></div>' +
    '<div class="stat"><b>' + finished + '</b><span>Books finished</span></div>' +
    '<div class="stat hot"><b>' + streak + '</b><span>Day streak</span></div>' +
    '<div class="stat"><b>' + pages + '</b><span>Pages read</span></div>';

  // Week strip (Monday to Sunday)
  var days = Lib.days(), now = new Date(), mon = new Date(now), dow = (now.getDay() + 6) % 7; mon.setDate(now.getDate() - dow);
  document.getElementById('week').innerHTML = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (l, i) {
    var d = new Date(mon); d.setDate(mon.getDate() + i);
    var on = days.indexOf(Lib.ymd(d)) > -1;
    return '<div><i class="' + (on ? 'on' : '') + '">' + (on ? '&#10003;' : '') + '</i>' + l + '</div>';
  }).join('');
  document.getElementById('streaknote').textContent = streak ? 'Keep it going. Read a little tomorrow to extend your streak.' : 'Open an e-book today to start a streak.';

  // Goal
  var goalEl = document.getElementById('goal');
  function goal() {
    var g = Math.max(1, Lib.goal()), done = Math.min(finished, g);
    goalEl.value = g;
    document.getElementById('ring').setAttribute('stroke-dasharray', (done / g * 251.3) + ' 251.3');
    document.getElementById('goaltext').textContent = finished + ' of ' + g + ' books';
    document.getElementById('goalsub').textContent = finished >= g ? 'Goal reached!' : (g - finished) + ' to go';
  }
  goalEl.onchange = function () { var n = parseInt(goalEl.value, 10); if (n > 0) Lib.setGoal(n); goal(); };
  goal();

  // Currently reading
  var cur = ids.filter(function (id) { return pr[id].page < pr[id].total; }).sort(function (a, b) { return pr[b].ts - pr[a].ts; });
  document.getElementById('reading').innerHTML = cur.length ? cur.map(function (id) {
    var b = Lib.book(id), pct = Math.round(pr[id].page / pr[id].total * 100);
    return '<div class="item"><a class="mini" href="book.html?id=' + b.id + '">' + Lib.cover(b) + '</a><div class="grow"><b>' + E(b.title) + '</b>' +
      '<div class="muted" style="font-size:12px">' + E(b.author) + '</div><div class="prog"><i style="width:' + pct + '%"></i></div><div class="muted" style="font-size:12px">' + pct + '% read</div></div>' +
      '<a class="btn" href="reader.html?id=' + b.id + '">Resume</a></div>';
  }).join('') : '<p class="muted">Nothing in progress. <a href="ebooks.html"><u>Pick an e-book</u></a> to start.</p>';

  // Borrowed
  function borrowed() {
    var bor = Lib.borrowed(), keys = Object.keys(bor).filter(function (id) { return Lib.book(id); }), today = Lib.ymd(new Date());
    document.getElementById('borrowed').innerHTML = keys.length ? keys.map(function (id) {
      var b = Lib.book(id), late = bor[id] < today;
      return '<div class="item"><a class="mini" href="book.html?id=' + b.id + '">' + Lib.cover(b) + '</a><div class="grow"><b>' + E(b.title) + '</b>' +
        '<div style="font-size:12px;color:' + (late ? '#A23826' : '#4F6275') + '">' + (late ? 'Overdue since ' : 'Due ') + E(bor[id]) + '</div></div>' +
        '<button class="btn" data-ret="' + b.id + '">Return</button></div>';
    }).join('') : '<p class="muted">No borrowed books.</p>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-ret]'); if (!t) return;
    var x = Lib.borrowed(); delete x[t.getAttribute('data-ret')]; Lib.saveBorrowed(x); borrowed();
  });
  borrowed();

  // Badges
  var badges = [['First book finished', finished >= 1], ['5 books finished', finished >= 5], ['3-day streak', streak >= 3], ['7-day streak', streak >= 7], ['10 hours read', hours >= 10]];
  document.getElementById('badges').innerHTML = badges.map(function (b) {
    return '<span class="chip' + (b[1] ? ' on' : '') + '" style="cursor:default">' + b[0] + (b[1] ? '' : ' (locked)') + '</span>';
  }).join('');
})();
</script>
</body>
</html>
