<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap page" style="max-width:460px">
  <div class="card" id="box">
    <h1 id="title">Sign in</h1>

    <form id="form" novalidate>
      <div id="name-row" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="pass">Password</label>
      <div style="display:flex;gap:8px">
        <input id="pass" type="password" autocomplete="current-password">
        <button type="button" class="btn" id="show" style="padding:0 14px">Show</button>
      </div>
      <div class="msg err" id="err" role="alert" hidden></div>
      <button class="btn primary" type="submit" id="submit" style="width:100%;margin-top:16px">Sign in</button>
    </form>

    <p class="muted" style="text-align:center;margin:16px 0 0"><span id="switch-text">New here?</span>
      <button type="button" class="chip" id="switch" style="border:0;background:none;color:var(--green);font-weight:700;padding:0 6px">Create an account</button></p>

    <div id="done" hidden>
      <div class="msg ok" id="done-msg"></div>
      <div class="stack" style="margin-top:12px" id="done-links"></div>
    </div>
  </div>
</main>
<script src="js/lib.js"></script>
<script>
(function () {
  var mode = 'signin', busy = false, $ = function (id) { return document.getElementById(id); };

  function err(m) { var e = $('err'); e.hidden = !m; e.textContent = m || ''; }
  function nice(m) {
    m = String(m || '');
    if (/invalid login/i.test(m)) return 'Wrong email or password.';
    if (/already registered|already been registered|already exists/i.test(m)) return 'An account with this email already exists. Try signing in.';
    if (/not confirmed/i.test(m)) return 'Please confirm your email first. Check your inbox.';
    if (/rate limit|too many/i.test(m)) return 'Too many tries. Please wait a few minutes and try again.';
    if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Could not reach the server. Check your internet and try again.';
    return m || 'Something went wrong. Please try again.';
  }
  function setMode(m) {
    mode = m; err('');
    $('title').textContent = m === 'signin' ? 'Sign in' : 'Create account';
    $('name-row').hidden = m === 'signin';
    $('submit').textContent = m === 'signin' ? 'Sign in' : 'Create account';
    $('switch-text').textContent = m === 'signin' ? 'New here?' : 'Already a member?';
    $('switch').textContent = m === 'signin' ? 'Create an account' : 'Sign in';
    $('pass').autocomplete = m === 'signin' ? 'current-password' : 'new-password';
  }
  function nextUrl() { var n = Lib.qs('next'); return /^[\w\-]+\.html(\?[\w=&%\-]*)?$/.test(n || '') ? n : null; }
  function links(u) {
    return '<a class="btn primary" href="index.html">Go to home</a>' +
      (Lib.isStaff(u) ? '<a class="btn" href="admin.html">' + (u.role === 'admin' ? 'Open admin dashboard' : 'Manage books') + '</a>' : '');
  }
  function done(u, msg) {
    var n = nextUrl();
    if (n) { location.href = n; return; }
    $('form').hidden = true; $('switch').parentNode.hidden = true; $('title').textContent = 'You are in';
    $('done').hidden = false; $('done-msg').textContent = msg; $('done-links').innerHTML = links(u);
  }

  $('switch').onclick = function () { setMode(mode === 'signin' ? 'signup' : 'signin'); };
  $('show').onclick = function () { var p = $('pass'), s = p.type === 'password'; p.type = s ? 'text' : 'password'; this.textContent = s ? 'Hide' : 'Show'; };

  $('form').onsubmit = function (e) {
    e.preventDefault();
    if (busy) return;
    var email = $('email').value.trim().toLowerCase(), pw = $('pass').value, name = $('name').value.trim();
    if (mode === 'signup' && !name) return err('Enter your name.');
    if (!/^\S+@\S+\.\S+$/.test(email)) return err('Enter a valid email address.');
    if (pw.length < 6) return err('Password must be at least 6 characters.');
    err(''); busy = true; $('submit').disabled = true;
    var label = $('submit').textContent; $('submit').textContent = 'Please wait...';
    var p = mode === 'signin'
      ? Lib.signIn(email, pw).then(function (u) { done(u, 'Signed in as ' + (u.name || u.email) + '.'); })
      : Lib.signUp(email, pw, name).then(function (r) {
          if (r.confirm) { $('form').hidden = true; $('switch').parentNode.hidden = true; $('title').textContent = 'Check your email';
            $('done').hidden = false; $('done-msg').textContent = 'We sent a link to ' + email + '. Open it to confirm your account, then sign in.';
            $('done-links').innerHTML = '<a class="btn primary" href="signin.html">Back to sign in</a>'; }
          else done(r.user, 'Account created for ' + name + '.');
        });
    p.catch(function (x) { err(nice(x && x.message)); }).then(function () { busy = false; $('submit').disabled = false; $('submit').textContent = label; });
  };

  var cur = Lib.user();
  if (cur) {
    $('form').hidden = true; $('switch').parentNode.hidden = true;
    $('title').textContent = 'You are signed in';
    $('done').hidden = false; $('done-msg').textContent = 'Signed in as ' + (cur.name || cur.email) + '.';
    $('done-links').innerHTML = links(cur) + '<button class="btn" id="out">Sign out</button>';
    $('out').onclick = Lib.signOut;
  }
})();
</script>
</body>
</html>
